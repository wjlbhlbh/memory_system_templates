name: Tool adapter request
description: Request support for another AI coding assistant or rules-file format.
title: "[Adapter]: "
labels: ["adapter", "enhancement"]
body:
  - type: input
    id: tool
    attributes:
      label: Tool name
      placeholder: Example AI coding assistant
    validations:
      required: true
  - type: input
    id: entry_file
    attributes:
      label: Expected entry file or rules location
      placeholder: AGENTS.md, CLAUDE.md, .cursor/rules/..., etc.
    validations:
      required: true
  - type: textarea
    id: docs
    attributes:
      label: Official documentation or references
      description: Link official docs when available.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Startup behavior
      description: How should this tool read `.ai_memory/index.json` and `startup_order`?
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Adapter requirements
      options:
        - label: It does not require a specific file-tool API name.
        - label: It keeps startup short and loads extra memory only when task-relevant.
        - label: It asks for Startup Summary and Requirement Checklist.
